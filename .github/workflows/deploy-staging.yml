name: Deploy staging
# develop에 합치면 마이그레이션과 Edge Function을 staging Supabase에 올린다(개발 서버, docs/DEV_GUIDE.md ‘CI/CD’, ADR 0002).
# 비밀 값은 GitHub 저장소 Settings → Environments → staging에만 둔다.
on:
  push:
    branches: [develop]
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xxofyzgzrjrcrcxvftpn # sweetwo-staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - name: staging 연결
        run: supabase link --project-ref "$PROJECT_REF"
      - name: 올릴 마이그레이션 목록
        run: supabase migration list
      - name: 마이그레이션 올리기
        run: supabase db push
      - name: Edge Function 올리기(send-mail, mail-events. 비밀 값은 대시보드에서 따로 넣음)
        run: |
          supabase functions deploy send-mail --project-ref "$PROJECT_REF"
          supabase functions deploy mail-events --project-ref "$PROJECT_REF"
